<!doctype html>
<html lang="ru" xmlns:th="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Apte4ka Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
    <h1 class="site-logo"><a href="/" class="logo-link">Apte4ka</a></h1>
    <nav class="site-nav">
        <a sec:authorize="isAnonymous()" href="/login" class="nav-link">Войти</a>
        <a sec:authorize="isAuthenticated()" href="/logout" class="nav-link">Выйти</a>
        <a sec:authorize="isAuthenticated()" href="/admin" class="nav-link">Панель администратора</a>
        <a href="/cart" class="nav-link">Корзина</a>
    </nav>
</header>
<hr class="divider"/>
<main class="site-main">
    <form action="/admin/items/create" method="post" enctype="multipart/form-data" class="item-form" data-aos="fade-up">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="form-group">
            <label>
                Название товара:
                <input type="text" name="name" placeholder="Введите название товара" required class="form-control"/>
            </label>
        </div>
        <div class="form-group">
            <label>
                Цена, ₽:
                <input type="number" name="price" placeholder="Введите цену товара в рублях" required class="form-control"/>
            </label>
        </div>
        <div class="form-group">
            <label>
                Количество товара, шт:
                <input type="number" name="quantity" min="0" placeholder="Введите количество товара" required class="form-control"/>
            </label>
        </div>
        <div class="form-group">
            <label>
                Фотография:
                <input type="file" name="pathToImage" class="form-control"/>
            </label>
        </div>
        <input type="submit" value="Добавить" class="submit-btn">
    </form>
</main>

</body>
</html>
